name: Build and push Caddy image

# Runs on the GitHub mirror (this repo is Codeberg-first, mirrored to GH).
# Needs two repo secrets: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (a Docker Hub
# access token, not your password: hub.docker.com → Account Settings →
# Security → New Access Token).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  schedule:
    # Weekly: picks up new caddy:2 base + plugin releases without you noticing.
    # The --with lines in the Dockerfile are unpinned on purpose, so a rebuild
    # floats to whatever is current. Pin a version (module@tag) to freeze one.
    - cron: "0 3 * * 0"
  workflow_dispatch: # manual "Run workflow" button, for right now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: d3b0x0/caddy
          tags: |
            type=raw,value=latest
            type=date,format=%Y%m%d
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: matches every machine this image targets today (laptop
          # + VPS are both x86-64). arm64 via QEMU emulation makes the Go
          # compile painfully slow — add it when a Pi actually needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
