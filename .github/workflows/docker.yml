name: Build and push Caddy image

# Runs on the GitHub mirror (this repo is Codeberg-first, mirrored to GH).
# Needs two repo secrets: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (a Docker Hub
# access token, not your password: hub.docker.com → Account Settings →
# Security → New Access Token).
#
# Action pins are the node24 generation (checkout v7, docker/* v4/v4/v6/v7).
# Node 20 was removed from runners in Sept 2026 — anything on node20 (e.g.
# checkout v4, docker/* v3/v3/v5/v6) hard-fails now. Check before downgrading:
#   gh api repos/<owner>/<repo>/contents/action.yml --jq .content | base64 -d | grep -A1 runs:

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  schedule:
    # Weekly: picks up new caddy:2 base + plugin releases without you noticing.
    # The --with lines in the Dockerfile are unpinned on purpose, so a rebuild
    # floats to whatever is current. Pin a version (module@tag) to freeze one.
    - cron: "0 3 * * 0"
  workflow_dispatch: # manual "Run workflow" button, for right now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: d3b0x0/caddy
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: matches every machine this image targets today (laptop
          # + VPS are both x86-64). arm64 via QEMU emulation makes the Go
          # compile painfully slow — add it when a Pi actually needs it.
          platforms: linux/amd64
          push: true
          # pull the base even when cached: without this the weekly rebuild
          # can reuse a stale caddy:2 layer and "update" nothing at all.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
